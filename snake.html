<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; background: #1b1b2f; color: #eee; font-family: sans-serif; }
  canvas { background: #162447; border: 3px solid #e43f5a; border-radius: 6px; }
  #info { margin-bottom: 10px; font-size: 20px; }
  p { color: #aaa; font-size: 14px; }
</style>
</head>
<body>
  <div id="info">Puntos: <span id="score">0</span> | Récord: <span id="best">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <p>Flechas o WASD para mover · Espacio para reiniciar</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SIZE = 20, CELLS = canvas.width / SIZE;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let snake, dir, nextDir, food, score, best = 0, timer, over;

function start() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  score = 0; over = false;
  scoreEl.textContent = 0;
  placeFood();
  clearInterval(timer);
  timer = setInterval(tick, 110);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const hit = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
              snake.some(s => s.x === head.x && s.y === head.y);
  if (hit) {
    over = true;
    clearInterval(timer);
    best = Math.max(best, score);
    bestEl.textContent = best;
    draw();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e43f5a';
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7fff7f' : '#3ddc84';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('Pulsa Espacio para reiniciar', canvas.width / 2, canvas.height / 2 + 20);
  }
}

const keys = {
  ArrowUp: {x: 0, y: -1}, w: {x: 0, y: -1},
  ArrowDown: {x: 0, y: 1}, s: {x: 0, y: 1},
  ArrowLeft: {x: -1, y: 0}, a: {x: -1, y: 0},
  ArrowRight: {x: 1, y: 0}, d: {x: 1, y: 0},
};

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); start(); return; }
  const d = keys[e.key];
  if (d) {
    e.preventDefault();
    // evitar giro de 180 grados
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }
});

start();
</script>
</body>
</html>
